<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Sciaino</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #3a6ea5;
  background-image:
    linear-gradient(45deg, #3a6ea5 25%, #3b70a8 25%, #3b70a8 50%, #3a6ea5 50%, #3a6ea5 75%, #3b70a8 75%);
  background-size: 4px 4px;
  font-family: 'Geneva', 'Lucida Grande', 'Helvetica Neue', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.window {
  background: #c0c0c0;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #404040;
  border-bottom: 2px solid #404040;
  box-shadow: 1px 1px 0 #000000;
  max-width: 480px;
  width: 100%;
}

.title-bar {
  background: #c0c0c0;
  padding: 4px 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid #808080;
}

.close-box {
  width: 13px;
  height: 13px;
  background: #c0c0c0;
  border-top: 1px solid #ffffff;
  border-left: 1px solid #ffffff;
  border-right: 1px solid #404040;
  border-bottom: 1px solid #404040;
  flex-shrink: 0;
}

.title-text {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #000000;
  padding-right: 21px;
}

.window-body {
  padding: 24px 28px;
  border-top: 1px solid #ffffff;
}

h1 {
  font-size: 22px;
  font-weight: bold;
  color: #000000;
  margin-bottom: 4px;
}

.tagline {
  font-size: 12px;
  color: #555555;
  margin-bottom: 28px;
}

.divider {
  border: none;
  border-top: 1px solid #808080;
  border-bottom: 1px solid #ffffff;
  margin-bottom: 16px;
}

.section-label {
  font-size: 11px;
  font-weight: bold;
  color: #000000;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.projects {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.project-link {
  display: block;
  text-decoration: none;
  color: #000000;
  background: #d4d0c8;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-right: 2px solid #404040;
  border-bottom: 2px solid #404040;
  padding: 12px 14px;
  font-family: 'Geneva', 'Lucida Grande', 'Helvetica Neue', sans-serif;
  transition: none;
}

.project-link:hover {
  background: #000080;
  color: #ffffff;
}

.project-link:hover .project-desc {
  color: #c0c0ff;
}

.project-link:active {
  border-top: 2px solid #404040;
  border-left: 2px solid #404040;
  border-right: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
  padding: 13px 13px 11px 15px;
}

.project-name {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 3px;
}

.project-desc {
  font-size: 11px;
  color: #555555;
}

.footer {
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #808080;
  font-size: 10px;
  color: #808080;
  text-align: center;
}
</style>
</head>
<body>
<div class="window">
  <div class="title-bar">
    <div class="close-box"></div>
    <div class="title-text">gghostdadd</div>
  </div>
  <div class="window-body">
    <h1>Ryan Sciaino</h1>
    <div class="tagline">GitHub repos and experiments</div>

    <hr class="divider">
    <div class="section-label">Projects</div>
    <div class="projects">
      <a href="https://gghostdadd.github.io/bb-sonic-suite/" class="project-link">
        <div class="project-name">BB Sonic Suite</div>
        <div class="project-desc">Browser-based audio tools — tapedeck, sampler, and more</div>
      </a>
      <a href="https://github.com/gghostdadd/PBT" target="_blank" class="project-link">
        <div class="project-name">PBT</div>
        <div class="project-desc">Simple Max for Live playback tools for Ableton Live</div>
      </a>
      <a href="https://github.com/gghostdadd/Justa" target="_blank" class="project-link">
        <div class="project-name">Justa</div>
        <div class="project-desc">Simple Max for Live teaching tools</div>
      </a>
    </div>

  </div>
</div>
</body>
</html>
